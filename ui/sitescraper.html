<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SiteScraper</title>
<style>
:root{
  --bg:#0E0F11;--side:#0B0C0E;--panel:#141518;--raised:#1A1C20;--hover:#202227;
  --line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --text:#ECEDEF;--muted:#8B9099;--faint:#5C616A;
  --accent:#F0A63C;--accent-ink:#1E1404;--accent-soft:rgba(240,166,60,.12);
  --ok:#4CC38A;--ok-soft:rgba(76,195,138,.12);--warn:#E5B454;--warn-soft:rgba(229,180,84,.12);--err:#F0646E;--err-soft:rgba(240,100,110,.12);
  --r:10px;--r-sm:7px;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2c31;border-radius:10px;border:3px solid var(--bg)}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:"Segoe UI Variable Display","Segoe UI";font-weight:650;font-size:15px}.brand small{display:block;color:var(--faint);font-size:11px}
.form{padding:4px 20px 20px;overflow:auto;flex:1}
.sec{color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 10px}
.lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:500;margin-bottom:6px}
.lbl output{color:var(--text);font-variant-numeric:tabular-nums}
.input{width:100%;height:36px;padding:0 11px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field+.field{margin-top:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;padding:6px 0}
.switch input{display:none}.switch .tr{width:34px;height:20px;border-radius:20px;background:#2b2e34;position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.tr{background:var(--accent)}.switch input:checked+.tr::after{transform:translateX(14px)}
.switch small{display:block;color:var(--faint);font-size:11.5px}
.sidefoot{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--raised);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.07)}
.btn.lg{height:42px;font-size:14px}.btn.sm{height:30px;padding:0 10px;font-size:12.5px}.btn:disabled{opacity:.45;pointer-events:none}
.btn.danger{background:var(--err-soft);color:var(--err);border-color:transparent}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.recent button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:20px;padding:3px 9px;font-size:11.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent button:hover{color:var(--text);border-color:var(--line2)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--line)}
header h1{font-family:"Segoe UI Variable Display","Segoe UI";font-size:19px;font-weight:650;letter-spacing:-.01em}
header p{color:var(--muted);font-size:12.5px;margin-top:3px}
header .grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:14px 28px}.stats div+div{border-left:1px solid var(--line)}
.stats small{display:block;color:var(--faint);font-size:11.5px}.stats b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);position:relative}.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .25s}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 0;min-height:0;transition:grid-template-columns .18s}
.body.detail{grid-template-columns:minmax(0,1fr) 380px}
.tablewrap{overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;background:var(--bg);z-index:1;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:28px}
td{padding:10px 14px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td{background:rgba(255,255,255,.018)}tbody tr.sel td{background:var(--accent-soft)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.code{display:inline-block;min-width:38px;text-align:center;padding:2px 7px;border-radius:5px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--ok-soft);color:var(--ok)}
.code.w{background:var(--warn-soft);color:var(--warn)}.code.e{background:var(--err-soft);color:var(--err)}
.u{color:var(--faint);font-size:12px}
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--faint);padding:40px}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600;margin:14px 0 6px}
.empty .ico{width:52px;height:52px;border-radius:12px;background:var(--raised);display:grid;place-items:center;margin:0 auto;color:var(--muted)}
.detail-pane{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0}
.dh{display:flex;align-items:flex-start;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh b{font-weight:600;line-height:1.4;word-break:break-word}.dh .grow{flex:1;min-width:0}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;border:0;background:none;color:var(--faint);cursor:pointer;flex:none}.iconbtn:hover{background:var(--hover);color:var(--text)}
.kv{padding:14px 20px;border-bottom:1px solid var(--line)}
.kv small{display:block;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.kv div{color:var(--muted);line-height:1.55;word-break:break-word;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--text)}
.status{display:flex;align-items:center;gap:12px;height:36px;padding:0 28px;border-top:1px solid var(--line);background:var(--side);color:var(--muted);font-size:12px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}.running .status .dot{background:var(--accent);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
.status span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:relative}.menu .list{position:absolute;right:0;top:40px;background:var(--raised);border:1px solid var(--line2);border-radius:9px;padding:5px;min-width:200px;display:none;z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.menu.on .list{display:block}.menu .list button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu .list button:hover{background:var(--hover)}.menu .list small{color:var(--faint)}
.toasts{position:fixed;right:20px;bottom:50px;display:grid;gap:8px;z-index:30}
.toast{width:340px;padding:12px 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:flex-start}
.toast b{display:block;font-weight:600;margin-bottom:2px}.toast span{color:var(--muted);font-size:12.5px;word-break:break-word}
.toast .i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}.toast.err .i{background:var(--err)}
.toast a{color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:600;display:inline-block;margin-top:6px}
.filter{width:220px}
</style>
</head>
<body>
<div class="app" id="root">
  <aside>
    <div class="brand">
      <div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></div>
      <div><b>SiteScraper</b><small>Website crawler</small></div>
    </div>
    <div class="form">
      <div class="field">
        <div class="lbl">Start URL</div>
        <input class="input" id="url" placeholder="example.com" spellcheck="false">
        <div class="recent" id="recent"></div>
      </div>
      <div class="sec">Limits</div>
      <div class="field"><div class="lbl">Max pages <output id="o_pages"></output></div><input type="range" id="max_pages" min="1" max="1000" value="50"></div>
      <div class="field"><div class="lbl">Link depth <output id="o_depth"></output></div><input type="range" id="max_depth" min="0" max="10" value="2"></div>
      <div class="field"><div class="lbl">Delay between requests <output id="o_delay"></output></div><input type="range" id="delay" min="0" max="5" step="0.05" value="0.35"></div>
      <div class="field"><div class="lbl">Timeout <output id="o_timeout"></output></div><input type="range" id="timeout" min="2" max="60" value="15"></div>
      <div class="sec">Behaviour</div>
      <label class="switch"><span>Stay on this website<small>Ignore links to other domains</small></span><input type="checkbox" id="same_domain" checked><span class="tr"></span></label>
      <label class="switch"><span>Respect robots.txt<small>Skip pages the site disallows</small></span><input type="checkbox" id="robots" checked><span class="tr"></span></label>
    </div>
    <div class="sidefoot">
      <button class="btn primary lg" id="start">Start crawl</button>
      <button class="btn" id="preview">Preview single page</button>
    </div>
  </aside>
  <main>
    <header>
      <div class="grow"><h1 id="h">No crawl yet</h1><p id="hp">Enter a URL and start a crawl to collect titles, text, links, emails and phone numbers.</p></div>
      <input class="input filter" id="filter" placeholder="Filter results" spellcheck="false">
      <div class="menu" id="menu"><button class="btn" id="exportBtn">Export <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="list"><button data-f="xlsx">Excel workbook<small>.xlsx</small></button><button data-f="csv">CSV<small>.csv</small></button><button data-f="json">JSON<small>.json</small></button><button data-f="jsonl">JSON Lines<small>.jsonl</small></button></div></div>
    </header>
    <div class="stats"><div><small>Pages</small><b id="sPages">0</b></div><div><small>Successful</small><b id="sOk">0</b></div><div><small>Errors</small><b id="sErr">0</b></div><div><small>Emails</small><b id="sEm">0</b></div><div><small>Phones</small><b id="sPh">0</b></div></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="body" id="body">
      <div class="tablewrap" id="tw"></div>
      <div class="detail-pane" id="dp"></div>
    </div>
    <div class="status"><i class="dot"></i><span id="status">Ready</span><span style="flex:none;color:var(--faint)" id="elapsed"></span></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let api,rows=[],running=false,max=50,sel=-1,t0=0,timer;
const emails=new Set(),phones=new Set();
const fmt={max_pages:v=>v,max_depth:v=>v==0?"start page only":v,delay:v=>(+v).toFixed(2)+" s",timeout:v=>v+" s"};
const outs={max_pages:"o_pages",max_depth:"o_depth",delay:"o_delay",timeout:"o_timeout"};
Object.keys(outs).forEach(k=>{const i=$("#"+k);const u=()=>$("#"+outs[k]).textContent=fmt[k](i.value);i.oninput=u;u();});

let ds=null,dsTotal=0,rq=0;
function soon(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render();});}
const app={emit(ev,p){
  if(ev==="dataset"){ds=p;soon();}
  else if(ev==="rows"){p.rows.forEach((r,k)=>{r.i=p.start+k;rows.push(r);});dsTotal=p.total;soon();}
  else if(ev==="record"){rows.push(p);(p.emails||"").split("; ").filter(Boolean).forEach(e=>emails.add(e.toLowerCase()));(p.phones||"").split("; ").filter(Boolean).forEach(x=>phones.add(x));render();}
  else if(ev==="status")$("#status").textContent=p;
  else if(ev==="done"){setRunning(false);$("#prog").style.width="100%";
    render();toast("ok",p.stopped?"Stopped":"Finished",p.unit?`${p.count.toLocaleString()} ${p.unit} collected.`:`${p.count} page${p.count==1?"":"s"} collected.`);}
}};
window.app=app;

function toast(kind,title,text,action){
  const el=document.createElement("div");el.className="toast "+kind;
  el.innerHTML=`<span class="i"></span><div><b>${esc(title)}</b><span>${esc(text)}</span>${action?`<br><a>${esc(action[0])}</a>`:""}</div>`;
  if(action)el.querySelector("a").onclick=action[1];
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),action?8000:4200);
}
function code(r){if(!r.status)return `<span class="code e">—</span>`;const c=r.status>=400?"e":r.status>=300||r.error?"w":"";return `<span class="code ${c}">${r.status}</span>`;}
function renderDataset(){
  const cols=ds.columns,web=rows.filter(r=>r.Websitesi).length;
  $("#sPages").textContent=rows.length.toLocaleString();$("#sOk").textContent=web.toLocaleString();$("#sErr").textContent="0";
  $("#sEm").textContent="—";$("#sPh").textContent="—";
  if(running&&dsTotal)$("#prog").style.width=Math.min(100,rows.length/dsTotal*100)+"%";
  const q=$("#filter").value.trim().toLocaleLowerCase("tr");
  const list=q?rows.filter(r=>cols.some(c=>String(r[c]??"").toLocaleLowerCase("tr").includes(q))):rows;
  if(!rows.length){$("#tw").innerHTML=`<div class="empty"><div><b>Loading ${esc(ds.title)}…</b>Rows stream in as pages download.</div></div>`;return;}
  const shown=list.slice(0,400),keep=$("#tw").scrollTop;
  $("#tw").innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    shown.map(r=>`<tr data-i="${r.i}" class="${r.i===sel?"sel":""}">${cols.map(c=>`<td title="${esc(r[c]??"")}">${esc(r[c]||"—")}</td>`).join("")}</tr>`).join("")}</tbody></table>${
    list.length>shown.length?`<div class="empty" style="height:auto;padding:14px">Showing 400 of ${list.length.toLocaleString()} rows — type in the filter to narrow down. Export includes everything.</div>`:""}`;
  $("#tw").scrollTop=keep;
  $("#tw").querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>{
    sel=+tr.dataset.i;const d=rows.find(r=>r.i===sel);render();$("#body").classList.add("detail");
    $("#dp").innerHTML=`<div class="dh"><div class="grow"><b>${esc(d[cols[0]]||"")}</b></div>
     <button class="iconbtn" id="cb" title="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
     ${cols.slice(1).map(c=>`<div class="kv"><small>${esc(c)}</small><div>${c==="Websitesi"&&d[c]?`<a href="#" data-u="${esc(d[c])}">${esc(d[c])}</a>`:esc(d[c]||"—")}</div></div>`).join("")}`;
    $("#cb").onclick=()=>{sel=-1;$("#body").classList.remove("detail");render();};
    const a=$("#dp").querySelector("a[data-u]");if(a)a.onclick=e=>{e.preventDefault();let u=a.dataset.u;if(!/^https?:/i.test(u))u="https://"+u;api.open_url(u);};
  });
}
function render(){
  if(ds)return renderDataset();
  const ok=rows.filter(r=>r.status&&r.status<400&&!r.error).length;
  $("#sPages").textContent=rows.length;$("#sOk").textContent=ok;$("#sErr").textContent=rows.length-ok;
  $("#sEm").textContent=emails.size;$("#sPh").textContent=phones.size;
  if(running)$("#prog").style.width=Math.min(100,rows.length/max*100)+"%";
  const q=$("#filter").value.trim().toLowerCase();
  const list=rows.filter(r=>!q||[r.url,r.title,r.emails,r.phones,r.error].join(" ").toLowerCase().includes(q));
  if(!rows.length){$("#tw").innerHTML=`<div class="empty"><div><div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div><b>${running?"Fetching the first page…":"Nothing crawled yet"}</b>${running?"Results will stream in here.":"Pages appear here as they are fetched.<br>Click any row to inspect everything found on it."}</div></div>`;return;}
  const keep=$("#tw").scrollTop;
  $("#tw").innerHTML=`<table><colgroup><col style="width:76px"><col><col style="width:26%"><col style="width:72px"><col style="width:20%"><col style="width:52px"></colgroup>
   <thead><tr><th>Status</th><th>Page</th><th>Title</th><th>Words</th><th>Contacts</th><th>Depth</th></tr></thead><tbody>${
   list.map(r=>`<tr data-i="${r.i}" class="${r.i===sel?"sel":""}"><td>${code(r)}</td><td title="${esc(r.url)}">${esc(path(r.url))}</td>
   <td title="${esc(r.title||r.error)}">${r.title?esc(r.title):`<span class="u">${esc(r.error||"—")}</span>`}</td><td class="num">${r.word_count||"—"}</td>
   <td class="num" title="${esc([r.emails,r.phones].filter(Boolean).join(" · "))}">${esc([r.emails,r.phones].filter(Boolean).join(" · ")||"—")}</td><td class="num">${r.depth}</td></tr>`).join("")}</tbody></table>`;
  $("#tw").scrollTop=keep;
  $("#tw").querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>showDetail(+tr.dataset.i));
}
function path(u){try{const x=new URL(u);return x.pathname+(x.search||"")}catch{return u}}
async function showDetail(i){
  sel=i;render();const d=await api.detail(i);$("#body").classList.add("detail");
  const chips=s=>s?`<div class="chips">${s.split("; ").map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:`<div>None found</div>`;
  $("#dp").innerHTML=`<div class="dh"><div class="grow"><b>${esc(d.title||path(d.url))}</b><div class="u" style="margin-top:4px;word-break:break-all">${esc(d.final_url)}</div></div>
   <button class="iconbtn" id="ob" title="Open in browser"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
   <button class="iconbtn" id="cb" title="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
   ${d.error?`<div class="kv"><small>Error</small><div style="color:var(--err)">${esc(d.error)}</div></div>`:""}
   <div class="kv"><small>Description</small><div>${esc(d.description||"None")}</div></div>
   <div class="kv"><small>Emails</small>${chips(d.emails)}</div>
   <div class="kv"><small>Phones</small>${chips(d.phones)}</div>
   <div class="kv"><small>Headings</small><div>${esc(d.headings||"None").replaceAll(" | ","<br>")}</div></div>
   <div class="kv"><small>Facts</small><div>Status ${esc(d.status||"—")} · ${esc(d.content_type||"—")}<br>${d.word_count} words · ${d.links_found} links · depth ${d.depth}</div></div>
   <div class="kv" style="border:0"><small>Text</small><div style="max-height:none">${esc((d.text||"").slice(0,3000))}${(d.text||"").length>3000?"…":""}</div></div>`;
  $("#cb").onclick=()=>{sel=-1;$("#body").classList.remove("detail");render();};
  $("#ob").onclick=()=>api.open_url(d.final_url);
}
function opts(){return{url:$("#url").value.trim(),max_pages:+$("#max_pages").value,max_depth:+$("#max_depth").value,delay:+$("#delay").value,timeout:+$("#timeout").value,same_domain:$("#same_domain").checked,robots:$("#robots").checked};}
function setRunning(v){
  running=v;$("#root").classList.toggle("running",v);
  $("#start").textContent=v?"Stop":"Start crawl";$("#start").className="btn lg "+(v?"danger":"primary");
  $("#preview").disabled=v;clearInterval(timer);
  if(v){t0=Date.now();timer=setInterval(()=>$("#elapsed").textContent=Math.round((Date.now()-t0)/1000)+" s",500);}
}
async function begin(o){
  if(!o.url){$("#url").focus();return toast("err","URL required","Enter the website you want to crawl.");}
  rows=[];ds=null;dsTotal=0;
  const r=await api.start(o);if(r.error)return toast("err","Can't start",r.error);
  if(!r.dataset){rows=[];ds=null;}emails.clear();phones.clear();sel=-1;max=r.max;$("#body").classList.remove("detail");$("#prog").style.width="0";
  $("#h").textContent=new URL(r.url).hostname;$("#hp").textContent=r.url;setRunning(true);render();loadRecent();
}
$("#start").onclick=()=>running?api.stop():begin(opts());
$("#preview").onclick=()=>begin({...opts(),max_pages:1,max_depth:0});
$("#url").onkeydown=e=>{if(e.key==="Enter"&&!running)begin(opts());};
$("#filter").oninput=render;
$("#exportBtn").onclick=e=>{e.stopPropagation();$("#menu").classList.toggle("on");};
document.addEventListener("click",()=>$("#menu").classList.remove("on"));
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{
  const r=await api.export(b.dataset.f);if(!r)return;
  if(r.error)return toast("err","Export failed",r.error);
  toast("ok","Exported",r.path.split(/[\\/]/).pop(),["Show in folder",()=>api.open_path(r.path,true)]);
});
async function loadRecent(){
  const s=await api.get_state();
  $("#recent").innerHTML=(s.recent||[]).slice(0,5).map(u=>`<button title="${esc(u)}">${esc(u.replace(/^https?:\/\//,"").replace(/\/$/,""))}</button>`).join("");
  $("#recent").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>$("#url").value=s.recent[i]);
  return s;
}
window.addEventListener("pywebviewready",async()=>{
  api=window.pywebview.api;const s=await loadRecent();
  Object.entries(s.options||{}).forEach(([k,v])=>{const el=$("#"+k);if(!el)return;if(el.type==="checkbox")el.checked=v;else{el.value=v;el.oninput&&el.oninput();}});
  render();$("#url").focus();
});
</script>
</body>
</html>
